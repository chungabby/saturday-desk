<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Saturday 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F8D6CB'/%3E%3Cstop offset='1' stop-color='%23BDB876'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="boot" id="boot"><span>It’s saturday</span></div>

<main class="login" id="login" hidden>
  <div class="aura login-aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a5"></i></div>
  <div class="login-card">
    <div class="login-brand">It’s saturday</div>
    <h1>Welcome back.</h1>
    <p class="login-sub">選擇要進入的版本，再用 Google 帳號登入。</p>
    <div class="roles" id="roles" role="radiogroup" aria-label="版本">
      <button type="button" class="role on" data-role="boss" role="radio" aria-checked="true">
        <span class="orb" style="--c1:#EBA08B;--c2:#F8D6CB"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.8 4.5 2.5 6.2 7 7-4.5.8-6.2 2.5-7 7-.8-4.5-2.5-6.2-7-7 4.5-.8 6.2-2.5 7-7z"/></svg></span>
        <b>老闆</b><small>完整工作台，可編輯</small>
      </button>
      <button type="button" class="role" data-role="staff" role="radio" aria-checked="false">
        <span class="orb" style="--c1:#A6B8A3;--c2:#DCE4DA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3 6"/></svg></span>
        <b>員工</b><small>日常工作用的捷徑</small>
      </button>
    </div>
    <button type="button" class="gbtn" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      <span>使用 Google 帳號登入</span>
    </button>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="login-foot">只有授權的帳號可以進入，其他帳號會自動登出。</p>
  </div>
</main>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">It’s saturday<small>品牌工作台 · <span id="deskName">老闆版</span></small></div>
    <nav class="nav" id="nav" aria-label="分類"></nav>
    <div class="account panel">
      <div class="acc-row"><span class="acc-dot" aria-hidden="true"></span><div class="acc-meta"><b id="who">老闆</b><span id="whoMail"></span></div>
        <button class="round sm" id="logoutBtn" type="button" aria-label="登出" title="登出">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button></div>
      <div class="desk-switch" id="deskSwitch" hidden role="group" aria-label="切換版本">
        <button type="button" data-desk="boss" aria-pressed="true" class="on">老闆版</button><button type="button" data-desk="staff" aria-pressed="false">員工版</button>
      </div>
      <span class="sync" id="sync">讀取中…</span>
    </div>
    <div class="side-note editor-only">
      <span class="chip">小技巧</span>
      <div>按 <kbd>/</kbd> 搜尋捷徑<br>按 <kbd>E</kbd> 進入編輯，可拖曳排序、置頂常用連結。</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="topbar">
        <div class="hello">
          <h1 id="greet">Good morning.</h1>
          <p id="greetSub">老闆早安，今天也好好做品牌。</p>
        </div>
        <div class="actions">
          <label class="search" for="q">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="搜尋捷徑…" autocomplete="off">
          </label>
          <button class="pill editor-only" id="editBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>編輯</span>
          </button>
          <button class="round m-only" id="accBtn" type="button" aria-label="帳號與登出" title="帳號">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </button>
          <button class="round editor-only" id="settingsBtn" type="button" aria-label="分類與備份設定" title="分類與備份">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          </button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="hero">
      <div class="panel date">
        <h3>今天</h3>
        <div>
          <div class="dbig"><b id="dNum">29</b><sup id="dMonth">SEP 2026</sup></div>
          <div class="dweek" id="dWeek">星期二</div>
        </div>
        <div class="track" id="track"></div>
        <div class="dfoot" id="dFoot"></div>
      </div>
      <div class="quote" id="quote">
        <div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a5"></i></div>
        <div class="qhead">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9.5c.5-1 1.5-1.5 2.5-1.5M15 14l-2.5-2.5"/><circle cx="9" cy="10" r=".5" fill="currentColor"/></svg>
          <span id="hiLabel">嗨老闆</span>
        </div>
        <p class="qtext" id="qText"></p>
        <div class="qby" id="qBy"></div>
        <div class="qbtns">
          <button type="button" class="qbtn" id="qNext">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>換一句
          </button>
          <button type="button" class="qbtn ghost" id="qCopy">複製</button>
        </div>
      </div>
    </section>

    <div id="sections"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
